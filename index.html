        <g transform="translate(-3 0)" fill="#416180"><g id="sp-eyes"><circle cx="37" cy="55" r="2"/><circle cx="49" cy="55" r="2"/></g><path d="M41 61 H45 L43 63.5 Z"/></g>

  <script>
  /* Runs before the (large) data scripts, so Moody greets while the app loads. */
  (function () {
    var el = document.getElementById("splash");
    function gone() { if (el && el.parentNode) el.parentNode.removeChild(el); document.documentElement.classList.remove("splashing"); }
    var seen = false, force = /[?&]splash/.test(location.search);
    try { seen = sessionStorage.getItem("esinfr.splash") === "1"; sessionStorage.setItem("esinfr.splash", "1"); } catch (e) {}
    if (!force && (seen || navigator.webdriver)) return gone();
    document.documentElement.classList.add("splashing");
    var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var head = document.getElementById("sp-head"), wh = document.getElementById("sp-wh"), eyes = document.getElementById("sp-eyes");
    var t0 = performance.now(), ready = false, leaving = false, MIN = still ? 700 : 1350, MAX = 4000;
    function rot(x, y, cx, cy, deg) { var a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); return [cx + (x - cx) * c - (y - cy) * s, cy + (x - cx) * s + (y - cy) * c]; }
    function f(n) { return Math.round(n * 100) / 100; }
    /* a damped "flick": quick wiggle that settles */
    function flick(t, start, len, amp, freq) { var u = (t - start) / len; if (u < 0 || u > 1) return 0; return amp * Math.sin(u * Math.PI * 2 * freq) * (1 - u) * (1 - u); }
    function frame(now) {
      var t = now - t0;
      var l = flick(t, 260, 560, -22, 2) + flick(t, 880, 420, -12, 1.5);
      var r = flick(t, 500, 560, 22, 2) + flick(t, 880, 420, 12, 1.5);
      if (ready && t > MIN && !leaving) leave();
      if (t > 1400) { /* still loading: a slow, sleepy ear twitch every ~1.6 s */ var k = (t - 1400) % 1600; l += flick(k, 0, 500, -10, 1.5); r += flick(k, 250, 500, 10, 1.5); }
      var L = rot(30, 20, 37.2, 38.6, l), R = rot(62, 20, 55.4, 39.4, r);
      head.setAttribute("d", "M64.8 71.2 A23 23 0 1 1 28.4 43.2 L" + f(L[0]) + " " + f(L[1]) + " L46 34 L" + f(R[0]) + " " + f(R[1]) + " L64.8 44.8");
      var w = flick(t, 420, 700, 4, 1.5);
      wh.setAttribute("transform", "rotate(" + f(w) + " 58 58)");
      var b = t > 760 && t < 900 ? 1 - Math.sin((t - 760) / 140 * Math.PI) * .9 : 1;
      eyes.setAttribute("transform", "translate(0 " + f(55 * (1 - b)) + ") scale(1 " + f(b) + ")");
      if (el.parentNode) requestAnimationFrame(frame);
    }
    function leave() { if (leaving) return; leaving = true; el.classList.add("out"); setTimeout(gone, 360); }
    if (!still) requestAnimationFrame(frame); else el.classList.add("still");
    function onReady() { ready = true; if (still) setTimeout(leave, Math.max(0, MIN - (performance.now() - t0))); }
    if (document.readyState !== "loading") onReady(); else document.addEventListener("DOMContentLoaded", onReady);
    setTimeout(leave, MAX);
    el.addEventListener("pointerdown", leave);
    document.addEventListener("keydown", leave, { once: true });
  })();
  </script>
