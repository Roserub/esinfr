name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Check data files
        run: node tools/check-data.js
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll assets data _site/
          # Bump the offline cache name on every deploy so phones pick up new content.
          sed -i "s/esinfr-v1/esinfr-${GITHUB_SHA::8}/" _site/sw.js
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
