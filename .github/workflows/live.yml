name: Live site check

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"   # every morning: is the site still opening on iPhone?

jobs:
  live:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install Playwright with WebKit and Chromium
        run: npm install --no-save playwright@1.56.1 && npx playwright install webkit chromium
      - name: Open the live site like Esin (iPhone, iPad, Mac), splash on
        run: node tools/live-check.js
      - name: Same check on this branch's files (Safari engine)
        if: github.event_name == 'pull_request'
        run: |
          npx --yes http-server@14.1.1 -p 8080 -s . &
          sleep 3
          node tools/live-check.js http://localhost:8080/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-shots
          path: live-shots/
